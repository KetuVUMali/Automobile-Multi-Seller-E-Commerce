<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password · OurtAuto Platform</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logos/favicon.svg">
<link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../assets/css/aos.css">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("ourt-theme"),p=ls.getItem("ourt-preset"),sb=ls.getItem("ourt-sidebar-style"),lw=ls.getItem("ourt-layout-width");
var resolved=t;
if(t==="system"){resolved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
if(t){d.setAttribute("data-theme",resolved);d.setAttribute("data-theme-mode",t);}
if(p)d.setAttribute("data-preset",p);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body data-theme="light">
<script>window.OURT_BASE = "../../";</script>
<div class="auth-shell">
  <div class="auth-visual">
  <div class="blob" style="width:280px;height:280px;background:#fff;opacity:.12;top:-60px;right:-60px;"></div>
  <div class="blob" style="width:200px;height:200px;background:#0c0f1c;opacity:.18;bottom:-60px;left:-40px;"></div>
  <div class="av-content">
    <div class="d-flex align-items-center gap-2 mb-4"><span class="ourt-brand-logo">O</span><span class="fs-20 fw-800 text-white">Ourt<span style="color:#ffe0d1;">Auto</span></span></div>
    <img src="../../assets/images/illustrations/auth-secure.svg" style="width:100%; max-width:340px;" class="mb-4" alt="">
    <h2>Forgot your password?</h2>
    <p>No worries — we'll send you a secure link to reset it and get you back into your dashboard.</p>
  </div>
</div>
  <div class="auth-form-side">
    <div class="auth-card">
      <div class="auth-brand d-lg-none"><span class="ourt-brand-logo">O</span><span class="fs-18 fw-800 text-heading">Ourt<span class="text-accent-c">Auto</span></span></div>
      <h3 class="mb-1">Reset your password</h3>
      <p class="text-muted-c fs-13 mb-4">Enter the email associated with your account and we'll send a reset link.</p>
      <form class="needs-validation" novalidate>
        <div class="mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" placeholder="you@company.com" required></div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Send Reset Link</button>
      </form>
      <p class="text-center fs-13 mb-0"><a href="../../pages/auth/login.html" class="fw-600"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a></p>
    </div>
  </div>
</div>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/aos.js"></script>
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/main.js"></script>

</body>
</html>
