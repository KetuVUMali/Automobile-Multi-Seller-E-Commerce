<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock Screen · OurtAuto Platform</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logos/favicon.svg">
<link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../assets/css/aos.css">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("ourt-theme")||"dark",p=ls.getItem("ourt-preset"),sb=ls.getItem("ourt-sidebar-style"),lw=ls.getItem("ourt-layout-width");
var resolved=t;
if(t==="system"){resolved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
d.setAttribute("data-theme",resolved);d.setAttribute("data-theme-mode",t);
if(p)d.setAttribute("data-preset",p);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body>
<script>window.OURT_BASE = "../../";</script>
<div class="error-shell">
  <div style="max-width:360px;width:100%;">
    <img src="../../assets/images/avatars/av-3.svg" style="width:84px;height:84px;border-radius:22px;" class="mb-3" alt="">
    <h4 class="mb-1">Ananya Rao</h4>
    <p class="text-muted-c fs-13 mb-4">Enter your password to unlock the dashboard.</p>
    <form class="needs-validation" novalidate>
      <div class="mb-3"><div class="position-relative"><input type="password" class="form-control text-center" placeholder="Password" required><button type="button" class="btn btn-icon btn-sm pwd-toggle-btn position-absolute end-0 top-0"><i class="bi bi-eye"></i></button></div></div>
      <button type="submit" class="btn btn-primary w-100"><i class="bi bi-unlock me-1"></i>Unlock</button>
    </form>
    <p class="fs-13 mt-3 mb-0"><a href="../../pages/auth/login.html">Not you? Sign in as a different user</a></p>
  </div>
</div>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/aos.js"></script>
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/main.js"></script>

</body>
</html>
