<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · OurtAuto Platform</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logos/favicon.svg">
<link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../assets/css/aos.css">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("ourt-theme")||"dark",p=ls.getItem("ourt-preset"),sb=ls.getItem("ourt-sidebar-style"),lw=ls.getItem("ourt-layout-width");
var resolved=t;
if(t==="system"){resolved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
d.setAttribute("data-theme",resolved);d.setAttribute("data-theme-mode",t);
if(p)d.setAttribute("data-preset",p);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body>
<script>window.OURT_BASE = "../../";</script>
<div class="auth-shell">
  <div class="auth-visual">
  <div class="blob" style="width:280px;height:280px;background:#fff;opacity:.12;top:-60px;right:-60px;"></div>
  <div class="blob" style="width:200px;height:200px;background:#0c0f1c;opacity:.18;bottom:-60px;left:-40px;"></div>
  <div class="av-content">
    <div class="d-flex align-items-center gap-2 mb-4"><span class="ourt-brand-logo">O</span><span class="fs-20 fw-800 text-white">Ourt<span style="color:#ffe0d1;">Auto</span></span></div>
    <img src="../../assets/images/illustrations/auth-secure.svg" style="width:100%; max-width:340px;" class="mb-4" alt="">
    <h2>Join thousands of dealers and sellers.</h2>
    <p>List vehicles, manage inventory, connect with customers and grow your automotive business online.</p>
  </div>
</div>
  <div class="auth-form-side">
    <div class="auth-card">
      <div class="auth-brand d-lg-none"><span class="ourt-brand-logo">O</span><span class="fs-18 fw-800 text-heading">Ourt<span class="text-accent-c">Auto</span></span></div>
      <h3 class="mb-1">Create your account</h3>
      <p class="text-muted-c fs-13 mb-4">Start your 14-day free trial. No credit card required.</p>
      <form class="needs-validation" novalidate>
        <div class="row g-2">
          <div class="col-6 mb-3"><label class="form-label">First Name</label><input class="form-control" required></div>
          <div class="col-6 mb-3"><label class="form-label">Last Name</label><input class="form-control" required></div>
        </div>
        <div class="mb-3"><label class="form-label">Business Email</label><input type="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" required></div>
        <div class="mb-3 form-check"><input class="form-check-input" type="checkbox" required><label class="form-check-label fs-13">I agree to the Terms of Service and Privacy Policy</label></div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
      </form>
      <p class="text-center fs-13 mb-0">Already have an account? <a href="../../pages/auth/login.html" class="fw-600">Sign in</a></p>
    </div>
  </div>
</div>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/aos.js"></script>
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/main.js"></script>

</body>
</html>
