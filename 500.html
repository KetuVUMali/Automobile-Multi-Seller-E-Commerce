<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Server Error · OurtAuto Platform</title>
<link rel="icon" type="image/svg+xml" href="assets/images/logos/favicon.svg">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/aos.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("ourt-theme")||"dark",p=ls.getItem("ourt-preset"),sb=ls.getItem("ourt-sidebar-style"),lw=ls.getItem("ourt-layout-width");
var resolved=t;
if(t==="system"){resolved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
d.setAttribute("data-theme",resolved);d.setAttribute("data-theme-mode",t);
if(p)d.setAttribute("data-preset",p);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body>
<script>window.OURT_BASE = "";</script>
<div class="error-shell">
  <div>
    <div class="error-code">500</div>
    <h4 class="mt-2 mb-2">Something went wrong</h4>
    <p class="text-muted-c fs-13 mb-4" style="max-width:380px; margin:0 auto;">An unexpected server error occurred. Our team has been notified — please try again in a few moments.</p>
    <div class="d-flex justify-content-center gap-2">
      <button class="btn btn-primary" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise me-1"></i>Retry</button>
      <a href="index.html" class="btn btn-light"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/aos.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
