<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found · OurtAuto Platform</title>
<link rel="icon" type="image/svg+xml" href="assets/images/logos/favicon.svg">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/aos.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<noscript><style>[data-aos]{opacity:1 !important; transform:none !important;}</style></noscript>
<script>(function(){try{
var d=document.documentElement,ls=window.localStorage;
var t=ls.getItem("ourt-theme"),p=ls.getItem("ourt-preset"),sb=ls.getItem("ourt-sidebar-style"),lw=ls.getItem("ourt-layout-width");
var resolved=t;
if(t==="system"){resolved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
if(t){d.setAttribute("data-theme",resolved);d.setAttribute("data-theme-mode",t);}
if(p)d.setAttribute("data-preset",p);
if(sb)d.setAttribute("data-sidebar",sb);
if(lw)d.setAttribute("data-layout",lw);
}catch(e){}})();</script>
</head>
<body data-theme="light">
<script>window.OURT_BASE = "";</script>
<div class="error-shell">
  <div>
    <div class="error-code">404</div>
    <h4 class="mt-2 mb-2">Page not found</h4>
    <p class="text-muted-c fs-13 mb-4" style="max-width:380px; margin:0 auto;">The page you're looking for doesn't exist or may have been moved. Check the URL or head back to your dashboard.</p>
    <div class="d-flex justify-content-center gap-2">
      <a href="index.html" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
      <button class="btn btn-light" onclick="window.history.back()"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
    </div>
  </div>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/aos.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
